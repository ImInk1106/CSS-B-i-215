<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rectangles</title>
    <style>
        .outside{
            border: 3px dotted blue;
            border-radius: 15px;
            padding : 20px;
            width: 350px;
        }
        .middle{
            border : 3px dashed red;
            border-radius : 12px;
            padding : 20px;
        }
        .ineer{
            border: 3px solid  green;
            border-radius: 8px;
            padding : 25px 15px;
            text-align: center;
            font-size : 24px;
        }
    </style>
</head>
<body>
    <div class="outside">
        <div class="middle">
            <div class="inner">
                I am heavily packed<br>
                &lt;DIV&gt;
            </div>
        </div>
    </div>
</body>
</html>
